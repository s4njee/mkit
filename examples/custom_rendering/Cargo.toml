[package]
name = "mkit-example-custom-rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui_pre.workspace = true
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-video = { version = "=0.5.2", features = ["metal"] }

[dev-dependencies]
mkit-harness = { path = "../../crates/mkit-harness", version = "0.1.0" }
gpui-kit = "=0.6.4"
image = "=0.25.10"

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false
