[package]
name = "bench-app"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "bench_app"
path = "src/lib.rs"

[[bin]]
name = "bench-app"
path = "src/main.rs"

[dependencies]
gpui_pre = { package = "gpui-pre", version = "=0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5" }
gpui-kit = "=0.6.4"
serde_json = "1"

[dev-dependencies]
gpui_pre = { package = "gpui-pre", version = "=0.3.5", features = ["test-support"] }
