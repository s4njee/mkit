[package]
name = "mkit-inspector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mkit-harness = { path = "../mkit-harness", version = "0.1.0" }
gpui_pre = { workspace = true, features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "=0.25.10"
mkit-example-hello = { path = "../../examples/hello", version = "0.1.0" }
mkit-gallery = { path = "../../apps/gallery", version = "0.1.0" }
mkit-example-counter = { path = "../../examples/counter", version = "0.1.0" }
mkit-example-state-entities = { path = "../../examples/state_entities", version = "0.1.0" }
mkit-example-reactivity-views = { path = "../../examples/reactivity_views", version = "0.1.0" }
gpui-kit = "=0.6.4"

[[test]]
name = "mcp_fixture"
path = "tests/mcp_fixture.rs"
harness = false
