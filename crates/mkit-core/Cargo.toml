[package]
name = "mkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui_pre.workspace = true
futures = "=0.3.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSObject", "NSString", "block2"] }
block2 = "=0.6.2"
objc2 = "=0.6.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "UI_ViewManagement"] }

[dev-dependencies]
gpui_pre = { workspace = true, features = ["test-support"] }
